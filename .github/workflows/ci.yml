name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Used by the component, BDD and repository tests. The Testcontainers
      # suite starts its own container instead and ignores this one.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nokia_app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nokia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: nokia_app
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nokia_test
      # nothing reaches the real Open-Meteo in CI; a cache would only add noise
      HTTP_CACHE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Let docker-py reach Docker
        # urllib3-future replaces the real urllib3 and breaks docker-py, which
        # would make every Testcontainers test skip silently. See the script.
        run: python scripts/enable_docker_tests.py

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (no database, no network)
        run: pytest tests/domain tests/adapters -q

      - name: Contract tests (Pact consumer + provider verification)
        run: pytest tests/contract -q

      - name: Integration tests (Testcontainers PostgreSQL)
        run: pytest tests/integration -q

      - name: Component tests (full app, Open-Meteo stubbed)
        run: pytest tests/component -q

      - name: BDD scenarios (Behave)
        run: behave

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Component tests (React Testing Library)
        run: npm test

      - name: Build
        run: npm run build
